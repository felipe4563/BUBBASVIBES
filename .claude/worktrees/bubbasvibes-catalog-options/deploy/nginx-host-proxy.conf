# Config para el nginx NATIVO del VPS (fuera de Docker).
# Reenvía todo el tráfico de cdemo.codewave.com.bo al contenedor frontend,
# que escucha en 127.0.0.1:8081 (ver docker-compose.yml).
#
# Instalar en el VPS:
#   sudo cp deploy/nginx-host-proxy.conf /etc/nginx/sites-available/cdemo.codewave.com.bo
#   sudo ln -s /etc/nginx/sites-available/cdemo.codewave.com.bo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, para HTTPS (recomendado, igual que los demás dominios de este VPS):
#   sudo certbot --nginx -d cdemo.codewave.com.bo
# Certbot reescribe este archivo automáticamente agregando el bloque 443 ssl
# y el redirect 80→443, igual que en megaelectra.rusoft.dev.

server {
    listen 80;
    server_name cdemo.codewave.com.bo;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
